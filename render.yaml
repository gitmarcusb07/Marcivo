# Render backend (Hobby plan, no credit card).
# Dashboard → New → Blueprint → point at this repo.
#
# The resolver's browser lanes (Cinejoy playback, vcloud fallbacks) need
# Chromium on the instance. Render's native builds throw away ~/.cache between
# build and runtime, so the browser is pinned under /opt/render/project —
# PLAYWRIGHT_BROWSERS_PATH + the build step below handle that. LITE_MODE gates
# every browser lane off (HTTP-only profile, for a free instance). Set the
# remaining secret/URL values in the Render dashboard env vars.
services:
  - type: web
    name: marcivo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # "0" keeps the Playwright lanes reachable (needed for Cinejoy playback).
      - key: LITE_MODE
        value: "0"
      # npm's postinstall would duplicate the download — the explicit build
      # step below installs into PLAYWRIGHT_BROWSERS_PATH instead.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Only /opt/render/project survives the build → runtime handoff. This is
      # the path Render support recommends for Playwright browsers.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/.cache/playwright"
      # Set these in the Render dashboard (SecretFile / sync:false):
      - key: TMDB_API_KEY
        sync: false
      # Your Cloudflare Pages URL — CORS allowlist. No trailing slash.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SITE1_BASE_URL
        sync: false
      - key: SITE1_SEARCH_PATH
        sync: false
      - key: SITE2_BASE_URL
        sync: false
      - key: SITE2_SEARCH_PATH
        sync: false
      - key: SITE3_BASE_URL
        sync: false
      - key: SITE3_SEARCH_PATH
        sync: false
      - key: SITE4_BASE_URL
        sync: false
      - key: SITE4_SEARCH_PATH
        sync: false
      - key: SITE5_BASE_URL
        sync: false
      - key: SITE5_SEARCH_PATH
        sync: false
